name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test presence and Focus policies
        run: bash scripts/test.sh
      - name: Build and check universal preview package
        run: bash scripts/package-release.sh
      - name: Verify release checksums
        run: |
          cd dist/releases
          shasum -a 256 -c SHA256SUMS.txt
      - name: Retain verified preview package
        uses: actions/upload-artifact@v4
        with:
          name: universal-preview-${{ github.sha }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
